name: Run paper experiment

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment
        type: choice
        required: true
        default: results
        options:
          - results
          - native-smoke
          - native-test-grid
          - native-contact-cut
          - end-to-end
          - training-smoke
          - training-full

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-22.04
    # Official CPython 3.8.20 Bookworm image; the hosted tool cache omits this release.
    container: python:3.8.20-bookworm@sha256:d411270700143fa2683cc8264d9fa5d3279fd3b6afff62ae81ea2f9d070e390c
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify the reference interpreter
        run: python -c "import sys; assert sys.version_info[:3] == (3, 8, 20)"
      - name: Prepare output directory
        run: mkdir -p runs
      - name: Install analysis dependencies
        if: inputs.experiment == 'results'
        run: python -m pip install 'numpy==1.22.4'
      - name: Reproduce response alignment and the contact intervention
        if: inputs.experiment == 'results'
        run: |
          python analysis/reproduce.py --output runs/alignment.json
          python mechanism/verify.py | tee runs/contact-cut.json
      - name: Install the simulator and mesh assets
        if: startsWith(inputs.experiment, 'native-') || inputs.experiment == 'end-to-end'
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends libgl1 libegl1 libglfw3
          python -m pip install -r simulation/requirements.txt
          python -m pip install --no-deps robosuite==1.4.1
      - name: Replay 45 physical branches
        if: inputs.experiment == 'native-smoke'
        run: python simulation/replay.py smoke --report runs/native-smoke.json
      - name: Replay the held-out grid
        if: inputs.experiment == 'native-test-grid'
        run: python simulation/replay.py test-grid --workers 2 --report runs/native-grid.json
      - name: Simulate intact and interrupted contact from matching native states
        if: inputs.experiment == 'native-contact-cut'
        run: python -m mechanism.replay --workers 2 | tee runs/native-contact-cut.json
      - name: Install CPU training dependencies
        if: startsWith(inputs.experiment, 'training-') || inputs.experiment == 'end-to-end'
        run: |
          python -m pip install 'torch==2.4.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r training/requirements.txt
      - name: Train a miniature policy and score it
        if: inputs.experiment == 'training-smoke'
        run: python training/run.py smoke | tee runs/training-smoke.txt
      - name: Refit models, select on validation and evaluate
        if: inputs.experiment == 'training-full'
        run: |
          python training/run.py fit --out runs/contact --workers 2 --controls
          python training/run.py evaluate --run runs/contact --json runs/contact/test.json
      - name: Run the complete physical and learning experiments
        if: inputs.experiment == 'end-to-end'
        run: bash scripts/reproduce.sh runs/full 2
      - name: Downloadable results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.experiment }}-outputs
          path: runs/
          if-no-files-found: ignore
